<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agencia IA — El equipo</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .wrap { max-width: 1100px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; gap: 18px; }
    .intro { color: var(--muted); margin: 0; }
    .cv { background: linear-gradient(180deg, var(--panel2), var(--panel)); border: 1px solid var(--line); border-radius: 20px; overflow: hidden; scroll-margin-top: 80px; }
    .cv.focus { box-shadow: 0 0 0 2px var(--accent), var(--shadow); }
    .top2 { display: grid; grid-template-columns: 300px 1fr; gap: 0; }
    @media (max-width: 760px) { .top2 { grid-template-columns: 1fr; } }
    .turn { background: radial-gradient(circle at 50% 40%, #2a2f55, #14162a); display: flex; align-items: flex-end; justify-content: center; padding: 18px 8px 8px; position: relative; min-height: 220px; }
    .turn canvas { width: 100%; max-width: 300px; height: auto; }
    .turn .icon { position: absolute; top: 12px; left: 12px; font-size: 26px; }
    .body { padding: 18px; display: flex; flex-direction: column; gap: 12px; }
    .name { font-size: 26px; font-weight: 800; letter-spacing: -.01em; }
    .role { color: var(--muted); }
    .tipo { display: inline-block; font-size: 12px; padding: 2px 9px; border-radius: 99px; background: var(--chip); border: 1px solid var(--line); margin-left: 6px; vertical-align: middle; }
    .quote { font-style: italic; color: #d9d6ff; }
    .sec b { display: block; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 6px; }
    .skill { display: grid; grid-template-columns: 170px 1fr 34px; gap: 10px; align-items: center; font-size: 14px; padding: 3px 0; }
    @media (max-width: 520px) { .skill { grid-template-columns: 120px 1fr 30px; } }
    .skill .track { height: 8px; background: #2a2a42; border-radius: 9px; overflow: hidden; }
    .skill .track i { display: block; height: 100%; border-radius: 9px; }
    .skill span { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
    .chips { display: flex; gap: 6px; flex-wrap: wrap; } .chips span { font-size: 13px; padding: 4px 10px; border-radius: 99px; background: var(--chip); border: 1px solid var(--line); }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }
    .curso { background: var(--bg2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; margin-bottom: 6px; font-size: 14px; } .curso summary { cursor: pointer; } .curso ul { margin: 8px 0 4px; padding-left: 18px; }
    .stat { background: var(--bg2); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
    .stat .v { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; } .stat .l { font-size: 12px; color: var(--muted); }
  </style>
</head>
<body>
  <header class="top">
    <a href="./" style="text-decoration:none"><button>←<span class="lbl"> Oficina</span></button></a>
    <a id="brand" class="brand" href="./"></a>
    <span class="sp"></span>
    <a id="usageChip" class="chip" href="uso.html"></a>
  </header>
  <main class="wrap">
    <p class="intro">👩‍🚀 La tripulación de la estación. Cada uno tiene su personalidad (así opinan en las juntas creativas), sus habilidades y su historial real de trabajo.</p>
    <div id="list"></div>
  </main>
  <script type="module" src="equipo.js"></script>
</body>
</html>
