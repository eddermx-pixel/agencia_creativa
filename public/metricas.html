<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Métricas</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .wrap { max-width: 1000px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
    .kp { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }
    .kp div { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; } .kp b { display: block; font-size: 22px; } .kp span { font-size: 12px; color: var(--muted); }
    .g { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; }
    .bar { display: flex; align-items: center; gap: 8px; font-size: 13px; margin: 5px 0; } .bar .l { width: 110px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .bar .t { flex: 1; height: 10px; background: var(--chip); border-radius: 6px; overflow: hidden; } .bar .t i { display: block; height: 100%; background: linear-gradient(90deg, #8b7bff, #22c993); } .bar .v { width: 92px; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
    dialog label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); } dialog .g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  </style>
</head>
<body>
  <header class="top">
    <a href="./" style="text-decoration:none"><button>←<span class="lbl"> Oficina</span></button></a>
    <a id="brand" class="brand" href="./"></a>
    <span class="sp"></span>
    <a id="usageChip" class="chip" href="uso.html"></a>
  </header>
  <main class="wrap">
    <h1 style="margin:0">📈 Métricas: qué funcionó mejor</h1>
    <div style="display:flex;gap:8px;flex-wrap:wrap" class="card"><select id="fcl" style="width:auto"></select><input type="month" id="fmes" style="width:auto"><span style="flex:1"></span><button class="primary" id="nueva">＋ Registrar resultados</button></div>
    <div class="kp" id="kp"></div>
    <div class="card" id="top"></div>
    <div class="g" id="g"></div>
    <p class="empty">Hoy los números se capturan a mano desde Meta, TikTok, etc. (alcance, interacciones, clics, leads, ventas, gasto). Con GoHighLevel conectado se podrán traer solos. La <b>interacción</b> = interacciones ÷ alcance. El equipo usa estos resultados al planear el siguiente mes.</p>
  </main>
  <dialog id="dlg"><div class="body" id="dlgB" style="min-width:min(520px,90vw)"></div></dialog>
  <script type="module" src="metricas.js"></script>
</body>
</html>
