<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Agencia IA — Feed</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    html, body { height: 100%; overflow: hidden; }
    body { display: flex; flex-direction: column; }
    @media (max-width: 520px) { header.top .brand { display: none; } header.top .tabs button { padding: 8px 10px; font-size: 14px; } }
    .tabs { display: flex; gap: 6px; } .tabs button, header.top button { white-space: nowrap; }
    .tabs button.on { background: var(--ink); color: var(--bg); }
    #deck { position: relative; flex: 1; width: min(480px, 100%); margin: 0 auto; padding: 12px 16px 0; min-height: 0; }
    .sc { touch-action: none; -webkit-user-select: none; position: absolute; inset: 12px 16px 0; background: var(--panel); border-radius: 22px; box-shadow: var(--shadow); border: 1px solid var(--line); overflow: hidden; display: flex; flex-direction: column; touch-action: pan-y; user-select: none; will-change: transform; }
    .sc.back { transform: scale(.95) translateY(14px); opacity: .7; pointer-events: none; }
    .sc .who { display: flex; align-items: center; gap: 10px; padding: 12px 14px; }
    .sc .who .n { font-weight: 700; } .sc .who .c { color: var(--muted); font-size: 13px; }
    .sc .v { margin-left: auto; font-size: 12px; background: var(--chip); padding: 2px 8px; border-radius: 99px; }
    .media { flex: 1; min-height: 0; background: #111; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
    .media img { max-width: 100%; max-height: 100%; object-fit: contain; pointer-events: none; }
    .media iframe.v1 { border: 0; width: 1080px; height: 1920px; transform-origin: top left; position: absolute; left: 0; top: 0; pointer-events: none; }
    .media iframe.v2 { border: 0; position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; background: #000; }
    .media .ph { font-size: 64px; opacity: .5; }
    .media .zoom { position: absolute; right: 10px; top: 10px; z-index: 3; width: 42px; height: 42px; padding: 0; border-radius: 50%; font-size: 20px; background: rgba(12,12,20,.7); color: #fff; border-color: rgba(255,255,255,.25); backdrop-filter: blur(6px); }
    .media pre { white-space: pre-wrap; margin: 0; padding: 18px; color: var(--ink); background: var(--panel); width: 100%; height: 100%; overflow: auto; font: 16px/1.5 system-ui; pointer-events: auto; }
    .meta { padding: 12px 14px 14px; } .meta h3 { margin: 0 0 4px; font-size: 17px; } .meta p { margin: 0; color: var(--muted); font-size: 14px; }
    .stamp { position: absolute; top: 70px; padding: 6px 14px; border: 4px solid; border-radius: 10px; font-weight: 900; font-size: 30px; opacity: 0; z-index: 2; letter-spacing: .05em; }
    .stamp.yes { left: 22px; color: var(--ok); transform: rotate(-14deg); } .stamp.nope { right: 22px; color: var(--no); transform: rotate(14deg); }
    .bar { display: flex; justify-content: center; gap: 22px; padding: 14px 16px calc(14px + env(safe-area-inset-bottom)); }
    .bar button { width: 64px; height: 64px; border-radius: 50%; font-size: 26px; background: var(--panel); box-shadow: var(--shadow); border: 1px solid var(--line); }
    .bar button.sm { width: 52px; height: 52px; font-size: 20px; align-self: center; }
    .done { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 8px; color: var(--muted); padding: 24px; }
    .done b { font-size: 22px; color: var(--ink); }
    #grid { display: none; flex: 1; overflow: auto; padding: 16px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; align-content: start; max-width: 1100px; margin: 0 auto; width: 100%; }
    #grid.on { display: grid; }
    .tile { background: var(--panel); border-radius: 14px; overflow: hidden; border: 1px solid var(--line); cursor: pointer; }
    .tile .th { aspect-ratio: 4/5; background: #111; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; color: #fff; }
    .tile .th img { width: 100%; height: 100%; object-fit: cover; }
    .tile .th iframe.v1 { border: 0; width: 1080px; height: 1920px; transform-origin: top left; position: absolute; left: 0; top: 0; pointer-events: none; }
    .tile .t { padding: 8px 10px; font-size: 13px; } .tile .t span { color: var(--muted); display: block; font-size: 12px; }
    .hint { text-align: center; color: var(--muted); font-size: 13px; padding: 2px 0 0; transition: opacity .4s; } .hint.off { opacity: 0; height: 0; padding: 0; overflow: hidden; }
    #viewer { position: fixed; inset: 0; z-index: 60; background: #000; display: none; flex-direction: column; }
    #viewer.on { display: flex; }
    #viewer .vtop { position: absolute; top: 0; left: 0; right: 0; z-index: 3; display: flex; align-items: center; gap: 10px; padding: calc(10px + env(safe-area-inset-top)) 12px 10px; background: linear-gradient(rgba(0,0,0,.7), transparent); color: #fff; pointer-events: none; }
    #viewer .vtop b { flex: 1; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #viewer .vtop button { pointer-events: auto; background: rgba(20,20,34,.85); color: #fff; border-color: rgba(255,255,255,.2); width: 42px; height: 42px; padding: 0; border-radius: 50%; }
    #vBody { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
    #vBody iframe.v2 { border: 0; width: 100%; height: 100%; background: #000; }
    #vBody iframe.v1 { border: 0; width: 1080px; height: 1920px; transform-origin: top left; position: absolute; }
    #vBody img { max-width: 100%; max-height: 100%; object-fit: contain; }
    #vBody pre { white-space: pre-wrap; margin: 0; padding: 70px 20px 130px; color: var(--ink); background: var(--panel); width: 100%; height: 100%; overflow: auto; font: 18px/1.55 system-ui; }
    #vBody .nosound { position: absolute; bottom: 120px; left: 0; right: 0; text-align: center; color: #fff9; font-size: 13px; }
    #vActs { position: absolute; left: 0; right: 0; bottom: 0; z-index: 3; display: none; justify-content: center; align-items: center; gap: 18px; padding: 14px 16px calc(14px + env(safe-area-inset-bottom)); background: linear-gradient(transparent, rgba(0,0,0,.7)); }
    #vActs button { width: 62px; height: 62px; border-radius: 50%; font-size: 26px; background: rgba(20,20,34,.9); border: 1px solid rgba(255,255,255,.25); color: #fff; }
    #vActs button.sm { width: 50px; height: 50px; font-size: 20px; }
    .sheet { z-index: 80 !important; }
    .sheet { position: fixed; inset: auto 0 0 0; background: var(--panel); border-radius: 20px 20px 0 0; padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); box-shadow: 0 -10px 30px rgba(0,0,0,.25); z-index: 20; transform: translateY(110%); transition: transform .2s; display: flex; flex-direction: column; gap: 10px; max-width: 560px; margin: 0 auto; }
    .sheet.on { transform: none; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; } .chips button { font-size: 13px; padding: 6px 10px; }
  </style>
</head>
<body>
  <header class="top">
    <a href="./" style="text-decoration:none"><button>←<span class="lbl"> Oficina</span></button></a>
    <a id="brand" class="brand" href="./"></a>
    <span class="sp"></span>
    <div class="tabs"><button class="on" id="tPend">Revisar <span class="badge" id="nPend"></span></button><button id="tOk">Aprobadas</button></div>
  </header>
  <div id="deck"></div>
  <div class="hint" id="hint">← desliza para rechazar · desliza para aprobar → · toca para ver en grande</div>
  <div class="bar" id="bar">
    <button id="bNo" title="Rechazar">✕</button>
    <button class="sm" id="bCom" title="Rechazar con comentario">💬</button>
    <button id="bYes" title="Aprobar">✓</button>
  </div>
  <div id="grid"></div>
  <div class="sheet" id="sheet">
    <b>¿Qué le cambio?</b>
    <div class="chips" id="chips"></div>
    <textarea id="com" style="min-height:80px" placeholder="Ej. usa el logo más grande y un fondo más claro"></textarea>
    <div style="display:flex;gap:8px;justify-content:flex-end"><button id="sCancel">Cancelar</button><button class="no" id="sSend">Rechazar y pedir cambio</button></div>
  </div>
  <div id="viewer" role="dialog" aria-label="Vista a pantalla completa">
    <div class="vtop"><button id="vClose" aria-label="Cerrar">✕</button><b id="vTitle"></b></div>
    <div id="vBody"></div>
    <div id="vActs"><button id="vNo" aria-label="Rechazar">✕</button><button class="sm" id="vCom" aria-label="Rechazar con comentario">💬</button><button id="vOk" aria-label="Aprobar">✓</button></div>
  </div>
  <script type="module" src="feed.js"></script>
</body>
</html>
