<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Motores de video</title>
  <link rel="stylesheet" href="styles.css">
  <style>.wrap{max-width:720px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:12px}.row{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;background:var(--panel);border:1px solid var(--line);border-radius:12px}.ok{color:#22c993}.no{color:#ff5d6c}</style>
</head>
<body>
  <header class="top"><a href="./" style="text-decoration:none"><button>←<span class="lbl"> Oficina</span></button></a><a id="brand" class="brand" href="./"></a><span class="sp"></span></header>
  <main class="wrap">
    <h1 style="margin:0">🎞️ Motores de video</h1>
    <div id="lista">Consultando…</div>
    <div class="card" style="padding:12px"><b>Prueba real</b><p class="empty" style="font-size:13px;margin:6px 0">Renderiza un video de 2 segundos con cada motor en este servidor (tarda de 30 s a 2 min la primera vez).</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button id="bhf">▶️ Probar HyperFrames</button><button id="brm">▶️ Probar Remotion</button></div><div id="res" style="margin-top:10px"></div></div>
  </main>
  <script type="module">
    import { esc } from './common.js';
    const $ = (i) => document.getElementById(i);
    const fila = (n, ok, d = '') => `<div class="row"><span>${esc(n)}</span><span class="${ok ? 'ok' : 'no'}">${ok ? '✅' : '❌'} ${esc(d)}</span></div>`;
    async function estado() {
      const d = await (await fetch('/api/motores/estado')).json();
      $('lista').innerHTML = [fila('ffmpeg', !!d.ffmpeg, d.ffmpeg || 'no encontrado'), fila('Render en el servidor (Chromium)', d.render_servidor === 'listo', d.render_servidor), fila('HyperFrames', d.hyperframes.instalado, d.hyperframes.version ? `v${d.hyperframes.version}` : 'no instalado'), (d.remotion.instalado && !d.remotion.activo ? `<div class="row"><span>Remotion</span><span style="color:#ffb547">⚠️ v${esc(d.remotion.version)} instalado pero apagado: poca memoria</span></div>` : fila('Remotion', d.remotion.instalado, d.remotion.version ? `v${d.remotion.version}` : 'no instalado')), fila('Estilos de película (Lemo Opuscar)', d.estilos_de_pelicula > 0, `${d.estilos_de_pelicula} estilos`), fila('Disco para renderizar (libre)', (d.disco?.trabajo_libre_mb ?? 0) > 1500, d.disco?.trabajo_libre_mb != null ? `${Math.round(d.disco.trabajo_libre_mb)} MB (volumen /data: ${Math.round(d.disco.volumen_data_libre_mb ?? 0)} MB)` : '?'), fila('Memoria del servidor', true, d.memoria?.limite_mb ? `límite ${d.memoria.limite_mb} MB · en uso ${d.memoria.usado_mb} MB` : `en uso ${d.memoria?.usado_mb ?? '?'} MB (sin límite visible)`), fila('Voz en off (ElevenLabs)', d.voz_elevenlabs), fila('Música con IA (ElevenLabs)', d.musica_ia), fila('Tomas de stock (Coverr/otras)', d.tomas_stock)].join('');
    }
    async function probar(motor, b) {
      b.disabled = true; $('res').textContent = 'Iniciando la prueba…';
      try {
        const r = await fetch(`/api/motores/probar?motor=${motor}`, { method: 'POST' }); const j = await r.json();
        if (!r.ok) throw new Error(j.error || r.status);
        for (;;) {
          await new Promise((ok) => setTimeout(ok, 3000));
          let p; try { const q = await fetch(`/api/motores/prueba?id=${j.id}`); if (q.status === 404) { $('res').innerHTML = '<span class="no">❌ El servidor se reinició mientras renderizaba: casi seguro le falta memoria a tu plan de Railway. Mira la fila de memoria arriba.</span>'; break; } p = await q.json(); } catch { $('res').textContent = 'Reconectando con el servidor…'; continue; }
          if (p.estado === 'corriendo') { $('res').textContent = `Renderizando… ${p.transcurrido} s (puede tardar unos minutos la primera vez)`; continue; }
          $('res').innerHTML = p.estado === 'listo' ? `<span class="ok">✅ Funciona (${p.segundos} s)</span>` : `<span class="no">❌ Falló: ${esc(p.error || 'sin detalle')}</span>`; break;
        }
      } catch (e) { $('res').innerHTML = `<span class="no">${esc(e.message)}</span>`; }
      b.disabled = false; estado();
    }
    $('bhf').onclick = (e) => probar('hyperframes', e.target); $('brm').onclick = (e) => probar('remotion', e.target);
    estado();
  </script>
</body>
</html>
