<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agencia IA — Clientes</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .wrap { max-width: 1100px; margin: 0 auto; padding: 16px; }
    .intro { color: var(--muted); margin: 0 0 16px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
    .cl { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px; cursor: pointer; display: flex; flex-direction: column; gap: 10px; box-shadow: var(--shadow); }
    .cl:hover { border-color: var(--accent); }
    .cl .logo { height: 70px; border-radius: 10px; background: var(--chip); display: flex; align-items: center; justify-content: center; overflow: hidden; font-weight: 800; font-size: 22px; color: var(--muted); }
    .cl .logo img { max-height: 60px; max-width: 90%; object-fit: contain; }
    .cl .n { font-weight: 700; } .cl .r { color: var(--muted); font-size: 13px; }
    .sw { display: flex; gap: 6px; } .sw span { width: 22px; height: 22px; border-radius: 6px; border: 1px solid rgba(0,0,0,.1); }
    .new { border: 2px dashed var(--line); background: transparent; box-shadow: none; align-items: center; justify-content: center; min-height: 170px; color: var(--muted); font-weight: 600; }
    .colors { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .colors .c { position: relative; }
    .colors input[type=color] { width: 46px; height: 40px; padding: 2px; border-radius: 10px; cursor: pointer; }
    .colors .x { position: absolute; top: -6px; right: -6px; width: 18px; height: 18px; padding: 0; border-radius: 50%; font-size: 11px; line-height: 18px; background: var(--no); color: #fff; }
    .logoPrev { display: flex; gap: 10px; align-items: center; }
    .logoPrev img { height: 56px; max-width: 160px; object-fit: contain; background: var(--chip); border-radius: 8px; padding: 4px; }
    .agency { margin-bottom: 22px; }
    .agencyRow { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
    .agencyLogo { width: 220px; height: 110px; border-radius: 14px; background: #07070c; border: 1px dashed var(--line); display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 13px; text-align: center; padding: 10px; }
    .agencyLogo img { max-width: 100%; max-height: 100%; object-fit: contain; }
    .agencyForm { flex: 1; min-width: 240px; display: flex; flex-direction: column; gap: 10px; }
    .agencyForm label { font-size: 13px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
    .actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    h2.sect { font-size: 14px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 6px; }
    .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 520px) { .two { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header class="top">
    <a href="./" style="text-decoration:none"><button>←<span class="lbl"> Oficina</span></button></a>
    <a id="brand" class="brand" href="./"></a>
    <span class="sp"></span>
    <a id="usageChip" class="chip" href="uso.html"></a>
  </header>
  <main class="wrap">
    <section class="card agency">
      <h2>🏢 Mi agencia</h2>
      <div class="agencyRow">
        <div class="agencyLogo" id="agLogo"></div>
        <div class="agencyForm">
          <label>Nombre de la agencia<input id="agName" placeholder="Ej. Pixel"></label>
          <label>Logo (se ve sobre fondo oscuro: ideal en blanco · PNG, SVG o WEBP · máx. 500 KB)<input type="file" id="agFile" accept="image/png,image/jpeg,image/webp,image/svg+xml"></label>
          <div class="actions" style="justify-content:flex-start"><button class="primary" id="agSave">Guardar</button><button id="agRemove" type="button">Quitar logo</button><span class="empty" id="agMsg"></span></div>
        </div>
      </div>
    </section>
    <h2 class="sect">🏷️ Clientes</h2>
    <p class="intro">El kit de marca de cada cliente (colores, logo, tono y público) lo leen todos los agentes en cada campaña.</p>
    <div class="grid" id="grid"></div>
  </main>

  <dialog id="dlg">
    <form class="body" id="form">
      <div class="head"><h3 id="dlgTitle">Nuevo cliente</h3></div>
      <label>Nombre *<input name="nombre" required placeholder="Ej. Panadería La Espiga"></label>
      <div class="two">
        <label>Rubro<input name="rubro" placeholder="Ej. Panadería artesanal"></label>
        <label>Tono de voz<input name="tono" list="tonos" placeholder="Ej. Cercano y divertido"></label>
      </div>
      <datalist id="tonos"><option>Cercano y divertido</option><option>Profesional</option><option>Premium y elegante</option><option>Juvenil y atrevido</option><option>Cálido y familiar</option></datalist>
      <label>Público objetivo<input name="publico" placeholder="Ej. Familias de 25 a 45 años de la zona"></label>
      <label>Colores de marca
        <div class="colors" id="colors"></div>
      </label>
      <div class="two">
        <label>Tipografía<input name="tipografia" placeholder="Ej. Montserrat, Playfair…"></label>
        <label>Logo (PNG, JPG, WEBP o SVG · máx. 500 KB)
          <input type="file" id="logoFile" accept="image/png,image/jpeg,image/webp,image/svg+xml">
        </label>
      </div>
      <div class="logoPrev" id="logoPrev"></div>
      <label>Reglas y notas para el equipo
        <textarea name="notas" placeholder="Ej. Nunca usar la palabra 'barato'. Siempre mencionar envío gratis. Evitar fotos de personas."></textarea>
      </label>
      <div class="actions">
        <button type="button" id="cancel">Cancelar</button>
        <button class="primary">Guardar</button>
      </div>
    </form>
  </dialog>
  <script type="module" src="clientes.js"></script>
</body>
</html>
