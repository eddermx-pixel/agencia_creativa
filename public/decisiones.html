  <link rel="stylesheet" href="styles.css">
  <style>
    .wrap { max-width: 760px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; }

    .big0 { text-align: center; padding: 48px 12px; color: var(--muted); font-size: 18px; }

    <a href="./" style="text-decoration:none"><button>←<span class="lbl"> Oficina</span></button></a>

    <span class="sp"></span>

  </header>
  <main class="wrap">
    <h1 style="margin:0">🔔 Decisiones pendientes</h1>
    <div class="opts card" style="padding:10px 12px">
      <button id="bNotif">🔔 Activar avisos en este dispositivo</button>
      <button id="bSnd"></button>
      <span class="empty" style="font-size:13px">También te llegan por Telegram si lo configuraste.</span>
