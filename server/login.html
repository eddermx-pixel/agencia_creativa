<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agencia IA — Entrar</title>
  <style>
    :root { color-scheme: dark; --bg: #0b0b12; --panel: #161622; --ink: #f1f0f7; --muted: #9a98ad; --line: #26263a; --accent: #8b7bff; --no: #ff5d6c; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(900px 500px at 20% 0%, #1b1640, transparent 60%), var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, sans-serif; padding: 16px; }
    form { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 28px; width: min(380px, 100%); display: flex; flex-direction: column; gap: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.08); }
    h1 { margin: 0; font-size: 22px; } p { margin: 0; color: var(--muted); font-size: 14px; }
    input { font: inherit; color: inherit; padding: 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); }
    button { font: inherit; padding: 12px; border: 0; border-radius: 10px; background: var(--accent); color: #fff; font-weight: 600; cursor: pointer; }
    .err { color: var(--no); font-size: 14px; display: none; }
  </style>
</head>
<body>
  <form method="post" action="/login">
    <img src="/api/agency/logo" alt="" style="max-height:56px;max-width:220px;object-fit:contain;align-self:flex-start" onerror="this.remove();document.getElementById('t').hidden=false">
    <h1 id="t" hidden>Agencia IA</h1>
    <p>Escribe la clave de acceso de tu oficina.</p>
    <div class="err" id="err">Clave incorrecta, intenta de nuevo.</div>
    <input type="password" name="key" placeholder="Clave" autofocus required autocomplete="current-password">
    <button>Entrar</button>
  </form>
  <script>if (location.search.includes('error=1')) document.getElementById('err').style.display = 'block';</script>
</body>
</html>
